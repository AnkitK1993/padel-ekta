name: Deploy

# Runs after CI passes on main. Stamps a fresh buildinfo.json version so the
# service worker detects the new build and shows the update banner in-app,
# eliminating the need to manually clear browser cache after deploys.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Minifies app.js/styles.css/every src+features module IN PLACE (same
      # filenames, no bundling) into dist/ — see scripts/build.js for what's
      # excluded and why.
      - run: npm run build

      # Stamp a fresh millisecond timestamp so sw.js detects the new build.
      # The SAME stamp goes into buildinfo.json (what the service worker
      # compares) and into index.html's <meta name="app-build"> (what the app
      # shows as "Build …" in the menu), so the running build is always
      # identifiable. Written into dist/ after the build, so it reflects this
      # actual deploy rather than being overwritten by the copy step.
      - name: Stamp build version
        run: |
          V=$(date +%s%3N)
          echo "{\"v\":$V}" > dist/buildinfo.json
          sed -i "s/__BUILD__/$V/" dist/index.html
          grep -q "content=\"$V\"" dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
