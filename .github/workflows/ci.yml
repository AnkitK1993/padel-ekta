name: CI

# Runs the test suites on every push and PR. `main` auto-deploys to GitHub
# Pages, so this is the gate that keeps a broken build from reaching production.
# The app itself is zero-dependency; esbuild is a devDependency used only by
# scripts/build.js (the production minify step Deploy runs before uploading).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required: browser-smoke.js / css-coverage.js drive Chrome
          # over CDP using the built-in global `WebSocket`, which only became a
          # global (no flag) in Node 22.4. On Node 20 they throw
          # "WebSocket is not defined".
          node-version: 22

      # Install Chrome and expose its path, so findBrowser() locates it
      # deterministically instead of relying on the runner image's layout.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: npm ci

      # Catches names that were never defined or imported — the kind of bug a
      # browser only finds when that code path first runs.
      - name: Lint (undefined names, duplicate keys)
        run: npm run lint

      - name: Unit + golden + americano tests
        run: npm test

      # Verifies the same minify step Deploy runs doesn't break — deploy.yml
      # only triggers after this workflow succeeds, so a broken build must
      # fail here, not silently in the deploy job.
      - name: Production build
        run: npm run build

      # Hermetic (Firebase is stubbed, no network): a failure here is a real
      # regression, so there is deliberately NO retry. Checks that a rating is
      # the same number on every screen, for the three main scoring systems.
      - name: Cross-screen consistency (headless Chrome)
        run: npm run test:consistency:browser
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      # axe-core over Home, Summary, Statistics, History, Player Detail and the
      # Admin names table: currently ZERO violations of any severity, so any new
      # one fails the build. Plus the keyboard/zoom checks axe can't see (Tab
      # reaches every clickable card, Enter/Space activate it, pinch-zoom works).
      - name: Accessibility (axe-core + keyboard, headless Chrome)
        run: npm run test:a11y && npm run test:keyboard
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      # Offline + update flow in a real browser, against the minified production
      # build in dist/ (what actually ships): full precache on first visit,
      # atomic update on a new deploy, a failed download is never half-applied.
      - name: Service worker update flow (headless Chrome)
        run: npm run test:sw -- --dist
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      # These two load the real Firebase SDK from gstatic (that import graph is
      # part of what they verify), so a transient network blip can fail them.
      # They are deterministic on re-run: retry once, but make the flake loud —
      # a warning annotation plus a line in the job summary — so a step that
      # keeps flaking is noticed instead of silently absorbed.
      - name: CSS coverage report
        run: |
          npm run css:coverage || { echo "::warning::css:coverage flaked; retrying once"; echo "- css:coverage flaked on this run (retried)" >> "$GITHUB_STEP_SUMMARY"; npm run css:coverage; }
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Browser smoke (headless Chrome)
        run: |
          npm run test:browser || { echo "::warning::browser smoke flaked; retrying once"; echo "- browser smoke flaked on this run (retried)" >> "$GITHUB_STEP_SUMMARY"; npm run test:browser; }
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
